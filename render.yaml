databases:
  - name: sports-stats-db
    plan: free

services:
  - type: web
    name: sports-stats-app
    runtime: python
    plan: free
    rootDir: sports-stats-app
    buildCommand: pip install -r requirements-cloud.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sports-stats-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
