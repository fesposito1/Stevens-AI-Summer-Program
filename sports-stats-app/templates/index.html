<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sports Stats Search</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div id="auth-screen" class="auth-screen">
    <div class="auth-box">
      <h1>Sports Stats Search</h1>
      <div class="auth-tabs">
        <button type="button" class="auth-tab-btn active" data-auth-tab="login">Login</button>
        <button type="button" class="auth-tab-btn" data-auth-tab="signup">Sign Up</button>
      </div>
      <form id="login-form" class="auth-form">
        <input type="text" id="login-username" placeholder="Username" autocomplete="username" required />
        <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required />
        <button type="submit">Log In</button>
      </form>
      <form id="signup-form" class="auth-form hidden">
        <input type="text" id="signup-username" placeholder="Username (min 3 chars)" autocomplete="username" required />
        <input type="password" id="signup-password" placeholder="Password (min 6 chars)" autocomplete="new-password" required />
        <button type="submit">Create Account</button>
      </form>
      <div id="auth-message" class="message hidden"></div>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="app-header">
      <h1>Sports Stats Search</h1>
      <div class="header-right">
        <span id="current-username"></span>
        <button type="button" id="logout-btn">Log Out</button>
      </div>
    </header>

    <nav class="tab-nav">
      <button type="button" class="tab-btn active" data-tab="your-stats">Your Stats</button>
      <button type="button" class="tab-btn" data-tab="player-stats">Player Stats</button>
      <button type="button" class="tab-btn" data-tab="compare">Compare</button>
      <button type="button" class="tab-btn" data-tab="leaderboard">Leaderboard</button>
      <button type="button" class="tab-btn" data-tab="projections">Projections</button>
    </nav>

    <main>
      <section id="tab-your-stats" class="tab-panel active"></section>
      <section id="tab-player-stats" class="tab-panel"></section>
      <section id="tab-compare" class="tab-panel"></section>
      <section id="tab-leaderboard" class="tab-panel"></section>
      <section id="tab-projections" class="tab-panel"></section>
    </main>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
