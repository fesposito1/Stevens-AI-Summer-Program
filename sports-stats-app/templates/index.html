<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sports Stats Search</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="sports-decor" aria-hidden="true">
    <span class="sports-decor-item deco-1">&#9917;</span>
    <span class="sports-decor-item deco-2">&#127936;</span>
    <span class="sports-decor-item deco-3">&#127944;</span>
    <span class="sports-decor-item deco-4">&#9918;</span>
    <span class="sports-decor-item deco-5">&#127934;</span>
    <span class="sports-decor-item deco-6">&#127954;</span>
    <span class="sports-decor-item deco-7">&#9971;</span>
    <span class="sports-decor-item deco-8">&#129357;</span>
  </div>

  <div id="auth-screen" class="auth-screen">
    <div class="auth-box">
      <h1>Sports Stats Search</h1>
      <div class="auth-tabs">
        <button type="button" class="auth-tab-btn active" data-auth-tab="login">Login</button>
        <button type="button" class="auth-tab-btn" data-auth-tab="signup">Sign Up</button>
      </div>
      <form id="login-form" class="auth-form">
        <input type="text" id="login-username" placeholder="Username" autocomplete="username" required />
        <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required />
        <button type="submit">Log In</button>
        <a href="#" id="forgot-link" class="auth-link">Forgot password?</a>
      </form>
      <form id="signup-form" class="auth-form hidden">
        <input type="text" id="signup-username" placeholder="Username (min 3 chars)" autocomplete="username" required />
        <input type="password" id="signup-password" placeholder="Password (min 6 chars)" autocomplete="new-password" required />
        <input type="text" id="signup-security-answer" placeholder="What sport do you play or follow most? (for password resets)" required />
        <button type="submit">Create Account</button>
      </form>
      <form id="forgot-username-form" class="auth-form hidden">
        <p class="auth-hint">Enter your username to look up your security question.</p>
        <input type="text" id="forgot-username" placeholder="Username" autocomplete="username" required />
        <button type="submit">Next</button>
        <a href="#" id="back-to-login-link" class="auth-link">Back to login</a>
      </form>
      <form id="forgot-reset-form" class="auth-form hidden">
        <p class="auth-hint" id="forgot-question-text"></p>
        <input type="text" id="forgot-answer" placeholder="Your answer" required />
        <input type="password" id="forgot-new-password" placeholder="New password (min 6 chars)" autocomplete="new-password" required />
        <button type="submit">Reset Password</button>
        <a href="#" id="back-to-login-link-2" class="auth-link">Back to login</a>
      </form>
      <div id="auth-message" class="message hidden"></div>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="app-header">
      <h1>Sports Stats Search</h1>
      <div class="header-right">
        <span id="current-username"></span>
        <button type="button" id="logout-btn">Log Out</button>
      </div>
    </header>

    <main>
      <section id="tab-home" class="tab-panel active"></section>
      <section id="tab-your-stats" class="tab-panel"></section>
      <section id="tab-calendar" class="tab-panel"></section>
      <section id="tab-player-stats" class="tab-panel"></section>
      <section id="tab-compare" class="tab-panel"></section>
      <section id="tab-leaderboard" class="tab-panel"></section>
      <section id="tab-projections" class="tab-panel"></section>
      <section id="tab-coach" class="tab-panel"></section>
      <section id="tab-admin" class="tab-panel"></section>
    </main>

    <nav class="tab-nav">
      <button type="button" class="tab-btn active" data-tab="home">
        <span class="tab-icon">&#127968;</span><span class="tab-label">Home</span>
      </button>
      <button type="button" class="tab-btn" data-tab="your-stats">
        <span class="tab-icon">&#128202;</span><span class="tab-label">Your Stats</span>
      </button>
      <button type="button" class="tab-btn" data-tab="calendar">
        <span class="tab-icon">&#128197;</span><span class="tab-label">Calendar</span>
      </button>
      <button type="button" class="tab-btn" data-tab="player-stats">
        <span class="tab-icon">&#128269;</span><span class="tab-label">Player Stats</span>
      </button>
      <button type="button" class="tab-btn" data-tab="compare">
        <span class="tab-icon">&#9878;&#65039;</span><span class="tab-label">Compare</span>
      </button>
      <button type="button" class="tab-btn" data-tab="leaderboard">
        <span class="tab-icon">&#127942;</span><span class="tab-label">Leaderboard</span>
      </button>
      <button type="button" class="tab-btn" data-tab="projections">
        <span class="tab-icon">&#128200;</span><span class="tab-label">Projections</span>
      </button>
      <button type="button" class="tab-btn" data-tab="coach">
        <span class="tab-icon">&#129302;</span><span class="tab-label">Coach</span>
      </button>
      <button type="button" class="tab-btn hidden" id="admin-tab-btn" data-tab="admin">
        <span class="tab-icon">&#128274;</span><span class="tab-label">Admin</span>
      </button>
    </nav>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
